# Production : VaultGuard derrière Caddy (HTTPS automatique Let's Encrypt).
#   cd deploy && cp ../.env.example .env.prod && nano .env.prod && docker compose up -d --build
services:
  vaultguard:
    build: ..
    env_file: .env.prod
    environment:
      HOST: 0.0.0.0
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
    volumes:
      - vg-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    expose: ["8000"]        # jamais publié directement : seul Caddy y accède

  caddy:
    image: caddy:2
    depends_on: [vaultguard]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?définir DOMAIN, ex. vaultguard.mondomaine.fr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

volumes:
  vg-data:
  caddy-data:
